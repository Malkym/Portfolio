# Déploiement Render — https://render.com
#
# Stratégie « base de données déportée » (Turso / libSQL, plan gratuit).
# Les données (contenu, likes, messages, commentaires, thème actif) vivent
# dans une base Turso hébergée dans le cloud : le système de fichiers
# éphémère du plan gratuit de Render n'est plus un obstacle, ni au
# déploiement ni à la mise en veille.
#
# La base se règle par DEUX variables, à saisir dans le tableau de bord
# Render (Environment) — jamais dans ce fichier versionné :
#   TURSO_DATABASE_URL   ex. libsql://portfolio-votrecompte.turso.io
#   TURSO_AUTH_TOKEN     jeton généré depuis le tableau de bord Turso
#
# Sans elles, l'application démarre quand même… sur une SQLite locale
# éphémère : contenus réinitialisés à chaque déploiement. Vérifiez-les.
#
# Contrepartie acceptée : les IMAGES ENVOYÉES depuis l'administration ne
# survivent pas (aucun disque persistant). Utilisez des URLs d'images
# externes — le champ est prévu dans l'administration.
#
# La mise en veille subsiste (inactivité ≈ 15 min, réveil ≈ 1 min).
# Un ping externe toutes les 10 minutes (UptimeRobot, cron-job.org —
# gratuits) sur /api/health empêche le service de dormir.

services:
  - type: web
    name: portfolio
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    branch: main

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      # Générés automatiquement par Render, jamais visibles dans le dépôt.
      - key: JWT_SECRET
        generateValue: true
      - key: VISITOR_SALT
        generateValue: true

      # Base distante — le factory de server/database/db.ts bascule sur le
      # pilote Turso dès que TURSO_DATABASE_URL est défini.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false

      # À saisir à la main dans le tableau de bord Render (Environment).
      # `sync: false` empêche toute valeur d'atterrir dans ce fichier versionné.
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_PATH
        sync: false
      - key: ADMIN_SECRET_QUESTION
        sync: false
      - key: ADMIN_SECRET_ANSWER
        sync: false
